name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: common_messaging_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d common_messaging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMMON_MESSAGING_POSTGRES: Host=127.0.0.1;Port=5432;Database=common_messaging_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common.Diagnostics

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common.Secrets

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore core tests
        run: dotnet restore Common.Messaging.UnitTests/Common.Messaging.UnitTests.csproj
      - name: Restore hosting integration
        run: dotnet restore Common.Messaging.Hosting/Common.Messaging.Hosting.csproj
      - name: Build hosting integration
        run: dotnet build Common.Messaging.Hosting/Common.Messaging.Hosting.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build Common.Messaging.UnitTests/Common.Messaging.UnitTests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Common.Messaging.UnitTests/Common.Messaging.UnitTests.csproj --configuration Release --no-build

name: Publish Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/fitzroywright/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore Common.Messaging.csproj
      - run: dotnet build Common.Messaging.csproj --configuration Release --no-restore
      - run: dotnet pack Common.Messaging.csproj --configuration Release --no-build --output ./artifacts
      - run: dotnet nuget push './artifacts/*.nupkg' --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
